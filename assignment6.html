<!DOCTYPE html>
<html>
<head>
<title>PHP Form</title>

<style>
body{
font-family: Arial;
background:#fff;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.form-box{
border:1px solid #ccc;
padding:20px;
width:300px;
}

input{
width:100%;
padding:8px;
margin:8px 0;
border:1px solid #ccc;
}

button{
width:100%;
padding:8px;
background:#fff;
border:1px solid #000;
cursor:pointer;
}
</style>

</head>

<body>

<div class="form-box">

<h2>Register</h2>

<form>
<input type="text" placeholder="First Name">
<input type="text" placeholder="Last Name">
<input type="email" placeholder="Email">
<input type="password" placeholder="Password">

<button>Submit</button>
</form>

</div>

</body>
</html>
